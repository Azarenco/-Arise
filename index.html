<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARISE</title>
<meta name="theme-color" content="#03050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARISE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#eaf0fb; --bg2:#d9e4f6; --panel:rgba(255,255,255,.82); --panel2:#ffffff; --line:rgba(28,88,178,.2); --line2:rgba(28,88,178,.48);
  --sys:#1665d8; --sys2:#0b4fb0; --glow:rgba(22,101,216,.25); --vio:#5b3fd6; --vio2:#43299f; --gold:#a8730a; --red:#d22640; --ok:#13915e;
  --tx:#0b1733; --tx2:#41537a; --tx3:#7486a6; --shade:rgba(11,23,51,.5); --veil:rgba(234,240,251,.9);
  --c-comun:#7d8899; --c-rara:#1f78e0; --c-epica:#7a45e6; --c-legendaria:#b9800b; --c-mitica:#d0263c;
  color-scheme: light;
  --f-ui:'Chakra Petch', 'Segoe UI', system-ui, sans-serif; --f-ep:'Cinzel', 'Trajan Pro', Georgia, serif;
  --hud-h:86px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#03050b; --bg2:#08101f; --panel:rgba(9,20,44,.72); --panel2:rgba(13,29,62,.92); --line:rgba(102,183,255,.22); --line2:rgba(118,196,255,.62);
  --sys:#5cb8ff; --sys2:#a9e4ff; --glow:rgba(76,170,255,.45); --vio:#9877ff; --vio2:#cdbdff; --gold:#f4c652; --red:#ff4a60; --ok:#52e3a6;
  --tx:#e4efff; --tx2:#93a7cb; --tx3:#5b6c90; --shade:rgba(0,0,0,.7); --veil:rgba(3,5,11,.96);
  --c-comun:#a8b3c4; --c-rara:#4fa8ff; --c-epica:#b07cff; --c-legendaria:#ffbe3d; --c-mitica:#ff4d62;
  color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#03050b; --bg2:#08101f; --panel:rgba(9,20,44,.72); --panel2:rgba(13,29,62,.92); --line:rgba(102,183,255,.22); --line2:rgba(118,196,255,.62);
  --sys:#5cb8ff; --sys2:#a9e4ff; --glow:rgba(76,170,255,.45); --vio:#9877ff; --vio2:#cdbdff; --gold:#f4c652; --red:#ff4a60; --ok:#52e3a6;
  --tx:#e4efff; --tx2:#93a7cb; --tx3:#5b6c90; --shade:rgba(0,0,0,.7); --veil:rgba(3,5,11,.96);
  --c-comun:#a8b3c4; --c-rara:#4fa8ff; --c-epica:#b07cff; --c-legendaria:#ffbe3d; --c-mitica:#ff4d62;
  color-scheme: dark; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hud-h))}
html,body{overflow-x:clip; margin:0; min-height:100%; background:var(--bg); color:var(--tx); font-family:var(--f-ui); font-size:15px; line-height:1.45}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--sys); outline-offset:2px}
input, select{font:inherit; color:var(--tx); background:var(--panel2); border:1px solid var(--line2); border-radius:4px; padding:10px 12px}
.ic{width:1em; height:1em; fill:currentColor; flex:none; display:block}
#bgfx{position:fixed; inset:0; z-index:0; pointer-events:none}
.aura{position:fixed; inset:-20% -20% auto; height:70vh; z-index:0; pointer-events:none;
  background:radial-gradient(60% 50% at 30% 20%, color-mix(in srgb, var(--sys) 16%, transparent), transparent 70%),
             radial-gradient(50% 40% at 80% 10%, color-mix(in srgb, var(--vio) 14%, transparent), transparent 70%)}
#app{position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; overflow-x:clip; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* ---------- HUD ---------- */
.hud{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; gap:12px; align-items:center; padding:12px 14px 10px;
  background:linear-gradient(var(--bg) 70%, transparent); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.emblem{position:relative; width:54px; height:60px; display:grid; place-items:center; flex:none}
.emblem svg.hex{position:absolute; inset:0; width:100%; height:100%}
.emblem .hex path{fill:var(--panel2); stroke:var(--rk); stroke-width:3; filter:drop-shadow(0 0 6px var(--rk))}
.emblem b{position:relative; font-family:var(--f-ep); font-size:26px; font-weight:700; color:var(--rk); text-shadow:0 0 12px var(--rk)}
.who{flex:1; min-width:0}
.who .nm{font-family:var(--f-ep); font-weight:700; font-size:17px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .tt{font-size:12px; color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.xpbar{height:6px; margin-top:6px; background:color-mix(in srgb, var(--sys) 14%, transparent); border-radius:3px; overflow:hidden}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg, var(--sys), var(--sys2)); box-shadow:0 0 10px var(--sys); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpl{font-size:11px; color:var(--tx3); margin-top:3px; font-variant-numeric:tabular-nums}
.cur{display:flex; flex-direction:column; gap:3px; align-items:flex-end; font-size:13px; font-variant-numeric:tabular-nums}
.cur span{display:flex; align-items:center; gap:5px}
.cur .ic{font-size:14px}
.g{color:var(--gold)} .e{color:var(--vio)} .k{color:var(--sys)}

/* ---------- Nav ---------- */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:40; padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(transparent, var(--bg) 30%); }
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); padding:10px 8px 10px; }
.nav button{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; font-size:11px; color:var(--tx3); position:relative}
.nav button .ic{font-size:24px}
.nav button[aria-current="page"]{color:var(--sys)}
.nav button[aria-current="page"] .ic{filter:drop-shadow(0 0 8px var(--sys))}
.nav button[aria-current="page"]::before{content:""; position:absolute; top:-4px; width:22px; height:2px; background:var(--sys); box-shadow:0 0 8px var(--sys)}
.nav .dot{position:absolute; top:4px; right:calc(50% - 18px); width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red)}

/* ---------- Ventanas del Sistema ---------- */
main{padding:4px 14px 20px}
.win{position:relative; background:var(--panel); border:1px solid var(--line); padding:14px; margin:12px 0; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 0 24px color-mix(in srgb, var(--sys) 6%, transparent)}
.win::before,.win::after{content:""; position:absolute; width:12px; height:12px; border:2px solid var(--sys); pointer-events:none}
.win::before{top:-2px; left:-2px; border-right:0; border-bottom:0}
.win::after{bottom:-2px; right:-2px; border-left:0; border-top:0}
.win.vio{--sys:var(--vio)} .win.vio::before,.win.vio::after{border-color:var(--vio)}
.win.red::before,.win.red::after{border-color:var(--red)} .win.gold::before,.win.gold::after{border-color:var(--gold)}
.sys-title{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:10px 2px 2px}
.sys-title h1{font-family:var(--f-ep); font-weight:700; font-size:24px; margin:0; letter-spacing:.01em}
.sys-title .sub{font-size:13px; color:var(--tx2)}
.wh{display:flex; align-items:center; gap:8px; margin:0 0 10px}
.wh h2{font-family:var(--f-ep); font-size:16px; margin:0; font-weight:700; flex:1}
.wh .ic{font-size:20px; color:var(--sys)}
.muted{color:var(--tx2)} .small{font-size:12.5px} .tiny{font-size:11.5px; color:var(--tx3)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border:1px solid var(--line2); color:var(--sys);
  background:color-mix(in srgb, var(--sys) 10%, transparent); font-weight:600; letter-spacing:.02em; border-radius:2px; transition:background .2s, box-shadow .2s}
.btn:hover{background:color-mix(in srgb, var(--sys) 18%, transparent); box-shadow:0 0 16px var(--glow)}
.btn.primary{background:var(--sys); color:var(--bg); border-color:var(--sys); box-shadow:0 0 18px var(--glow)}
.btn.vio{--sys:var(--vio)} .btn.gold{--sys:var(--gold)} .btn.red{--sys:var(--red)}
.btn.primary.vio{background:var(--vio); border-color:var(--vio); box-shadow:0 0 18px color-mix(in srgb, var(--vio) 50%, transparent)} .btn.primary.gold{background:var(--gold); border-color:var(--gold); box-shadow:0 0 18px color-mix(in srgb, var(--gold) 50%, transparent)} .btn.primary.red{background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 0 18px color-mix(in srgb, var(--red) 50%, transparent)}
.btn.sm{padding:6px 10px; font-size:13px}
.btn[disabled]{opacity:.45; pointer-events:none}
.btn.wide{width:100%}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 8px; border:1px solid var(--line); color:var(--tx2); border-radius:2px; background:var(--panel)}
.chip .ic{font-size:13px}
.seg{display:inline-flex; border:1px solid var(--line2)}
.seg button{padding:5px 12px; font-size:13px; color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--sys); color:var(--bg)}

/* ---------- Jefe (tira) ---------- */
.bstrip{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--hud-h)); z-index:20; display:flex; gap:12px; align-items:center; padding:10px 12px; margin:8px 0 4px; cursor:pointer;
  background:linear-gradient(90deg, color-mix(in srgb, var(--red) 14%, var(--bg2)), var(--bg2) 60%); border:1px solid color-mix(in srgb, var(--red) 40%, var(--line)); box-shadow:0 8px 24px var(--shade)}
.bstrip .bport{width:44px; height:44px; display:grid; place-items:center; font-size:38px; color:var(--red); filter:drop-shadow(0 0 8px color-mix(in srgb, var(--red) 70%, transparent))}
.bstrip .binfo{flex:1; min-width:0}
.bstrip b{font-family:var(--f-ep); font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hp{position:relative; height:12px; margin-top:5px; background:color-mix(in srgb, var(--red) 12%, transparent); border:1px solid color-mix(in srgb, var(--red) 35%, transparent); overflow:hidden}
.hp i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, #a3122a, var(--red) 70%, #ff8a8f); box-shadow:0 0 10px var(--red); transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hp i.lag{background:color-mix(in srgb, var(--gold) 70%, transparent); box-shadow:none; transition:width 1.2s .35s ease-out}
.hp span{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; padding:0 6px; font-size:10px; font-weight:600; color:#fff; text-shadow:0 1px 2px #000; font-variant-numeric:tabular-nums}
.hp.seg10{background-image:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0,0,0,.35) calc(10% - 1px) 10%)}
.bstrip.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-2px)} 80%{transform:translateX(2px)}}

/* ---------- Bloques y hábitos ---------- */
.block .wh .prog{font-size:12px; color:var(--tx3); font-variant-numeric:tabular-nums}
.hrow{display:flex; align-items:center; gap:12px; padding:10px 6px; border-top:1px solid var(--line); position:relative; cursor:pointer; user-select:none; transition:background .2s; overflow:hidden}
.hrow:first-of-type{border-top:0}
.hrow:hover{background:color-mix(in srgb, var(--sys) 5%, transparent)}
.hic{width:36px; height:36px; display:grid; place-items:center; font-size:22px; border:1px solid var(--line); color:var(--stc); background:color-mix(in srgb, var(--stc) 10%, transparent); flex:none}
.hmain{flex:1; min-width:0}
.hmain b{display:block; font-weight:600; font-size:14.5px}
.hmain small{display:block; color:var(--tx3); font-size:12px}
.hmain .sug{color:var(--sys)}
.hxp{font-size:12px; color:var(--tx3); font-variant-numeric:tabular-nums; min-width:34px; text-align:right}
.hcheck{width:26px; height:26px; border:1.5px solid var(--line2); display:grid; place-items:center; flex:none; transform:rotate(45deg); transition:all .2s}
.hcheck .ic{transform:rotate(-45deg); font-size:14px; opacity:0}
.hrow.on .hcheck{background:var(--sys); border-color:var(--sys); box-shadow:0 0 12px var(--glow)}
.hrow.on .hcheck .ic{opacity:1; color:var(--bg)}
.hrow.on .hmain b{color:var(--tx2)}
.hrow.on .hxp{color:var(--sys)}
.hrow.prot .hcheck{border-style:dashed; border-color:var(--vio)}

.hrow.dis{opacity:.5; cursor:default}
.hrow.flash::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--sys) 30%, transparent), transparent); animation:sweep .6s ease-out forwards; pointer-events:none}
@keyframes sweep{from{transform:translateX(-100%)} to{transform:translateX(100%); opacity:0}}
.subs{display:flex; gap:6px; padding:0 6px 10px 54px; flex-wrap:wrap}
.subs button{font-size:12px; padding:4px 9px; border:1px solid var(--line); color:var(--tx2)}
.subs button[aria-pressed="true"]{border-color:var(--sys); color:var(--sys); background:color-mix(in srgb, var(--sys) 12%, transparent)}
.pips{display:inline-flex; gap:3px; vertical-align:middle; margin-right:4px}
.pips i{width:7px; height:7px; transform:rotate(45deg); border:1px solid var(--sys)}
.pips i.f{background:var(--sys)}

/* ---------- Floaters ---------- */
.float{position:fixed; z-index:80; pointer-events:none; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; animation:floatUp 1.1s ease-out forwards; text-shadow:0 0 10px currentColor}
.float.xp{color:var(--sys); font-size:15px}
.float.dmg{color:var(--red); font-size:22px; font-family:var(--f-ep)}
.float.crit{color:var(--gold); font-size:30px; font-family:var(--f-ep)}
.float.crit small{display:block; font-size:11px; font-family:var(--f-ui); letter-spacing:.1em; text-align:center}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6); opacity:0} 15%{transform:translate(-50%,-8px) scale(1.15); opacity:1} 100%{transform:translate(-50%,-56px) scale(1); opacity:0}}

/* ---------- Toast del Sistema ---------- */
#toasts{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 10px); transform:translateX(-50%); z-index:90; width:min(520px, calc(100% - 24px)); display:flex; flex-direction:column; gap:8px; pointer-events:none}
.toast{background:var(--panel2); border:1px solid var(--sys); color:var(--tx); padding:10px 14px; font-size:13.5px; box-shadow:0 0 22px var(--glow); animation:tin .35s ease-out, tout .4s ease-in 3.2s forwards}
.toast b{color:var(--sys)}
.toast.vio{border-color:var(--vio)} .toast.vio b{color:var(--vio)} .toast.red{border-color:var(--red)} .toast.red b{color:var(--red)}
@keyframes tin{from{opacity:0; transform:translateY(-10px) scaleY(.6)}}
@keyframes tout{to{opacity:0; transform:translateY(-8px)}}

/* ---------- Puerta ---------- */
.gate{position:relative; margin:4px -14px 0; padding:8px 14px 0; overflow:hidden}
.portal{position:relative; width:min(340px, 86vw); aspect-ratio:1; margin:6px auto 0; display:grid; place-items:center; --pc:var(--sys); --pc2:var(--vio)}
.portal.redg{--pc:var(--red); --pc2:#ff9a3d} .portal.goldg{--pc:var(--gold); --pc2:#fff1b0}
.portal .ring{position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--pc) 80%, transparent), transparent 30%, color-mix(in srgb, var(--pc2) 60%, transparent), transparent 60%, color-mix(in srgb, var(--pc) 70%, transparent), transparent);
  -webkit-mask:radial-gradient(circle, transparent 52%, #000 54%, #000 62%, transparent 70%); mask:radial-gradient(circle, transparent 52%, #000 54%, #000 62%, transparent 70%);
  animation:spin 9s linear infinite; filter:blur(1px)}
.portal .ring.r2{inset:8%; animation-duration:6s; animation-direction:reverse; opacity:.8;
  -webkit-mask:radial-gradient(circle, transparent 56%, #000 60%, #000 64%, transparent 70%); mask:radial-gradient(circle, transparent 56%, #000 60%, #000 64%, transparent 70%)}
.portal .ring.r3{inset:-6%; animation-duration:16s; opacity:.45; filter:blur(4px)}
.portal .core{position:absolute; inset:16%; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--pc) 20%, #000) 0%, #02030a 55%, color-mix(in srgb, var(--pc) 35%, #000) 75%, transparent 76%);
  box-shadow:0 0 60px color-mix(in srgb, var(--pc) 55%, transparent), inset 0 0 60px color-mix(in srgb, var(--pc) 60%, transparent)}
.portal .swirl{position:absolute; inset:18%; border-radius:50%; opacity:.6;
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--pc) 22%, transparent) 0 8deg, transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle, transparent 10%, #000 70%, transparent 72%); mask:radial-gradient(circle, transparent 10%, #000 70%, transparent 72%); animation:spin 14s linear infinite}
.boss-fig{position:relative; width:58%; aspect-ratio:1; color:#05060c; --bc:var(--red); filter:drop-shadow(0 0 2px var(--bc)) drop-shadow(0 0 16px var(--bc)) drop-shadow(0 0 44px color-mix(in srgb, var(--pc) 70%, transparent)); animation:hover 4.5s ease-in-out infinite; cursor:pointer}
.boss-fig .ic{width:100%; height:100%}
.boss-fig .ic path{fill:#04050b; stroke:color-mix(in srgb, var(--bc) 85%, #fff); stroke-width:4px; paint-order:stroke}
.boss-fig.hero-fig{--bc:var(--sys2)}
.boss-fig .eyes{position:absolute; inset:0; mix-blend-mode:screen}
.portal.dead .boss-fig{animation:none; opacity:.25; filter:grayscale(1) drop-shadow(0 0 4px var(--pc))}
.portal.dead::after{content:"Derrotado"; position:absolute; font-family:var(--f-ep); font-size:28px; color:var(--gold); text-shadow:0 0 18px var(--gold); transform:rotate(-8deg)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hover{50%{transform:translateY(-8px) scale(1.02)}}
.gate-meta{text-align:center; margin-top:-6px}
.boss-name{font-family:var(--f-ep); font-size:clamp(22px,6.4vw,30px); line-height:1.15; margin:4px 0 6px; font-weight:700; text-shadow:0 0 22px color-mix(in srgb, var(--red) 35%, transparent)}
.rk-pill{display:inline-grid; place-items:center; width:30px; height:30px; font-family:var(--f-ep); font-weight:700; color:var(--rk); border:1.5px solid var(--rk); transform:rotate(45deg); box-shadow:0 0 12px var(--rk); margin-right:10px}
.rk-pill span{transform:rotate(-45deg)}
.hpbig{height:20px; margin:12px 0 4px}
.hpbig span{font-size:12px}
.gate .stats{display:flex; justify-content:center; gap:14px; font-size:12.5px; color:var(--tx2)}
.hits{display:flex; flex-direction:column; gap:2px; max-height:240px; overflow:auto}
.hit{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed var(--line)}
.hit b{color:var(--red); font-variant-numeric:tabular-nums} .hit.c b{color:var(--gold)}
.best-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px}
.best{border:1px solid var(--line); padding:10px 6px 8px; text-align:center; background:var(--panel)}
.best .ic{width:54px; height:54px; margin:0 auto 6px; color:var(--red); filter:drop-shadow(0 0 6px color-mix(in srgb, var(--red) 60%, transparent))}
.best.unk .ic{color:var(--tx3); filter:none; opacity:.35}
.best small{display:block; font-size:11px; line-height:1.25; color:var(--tx2)}

/* ---------- Sombras ---------- */
.sh-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.shc{position:relative; border:1px solid var(--line); background:var(--panel); padding:12px 10px; text-align:center; overflow:hidden}
.shc .fig{width:76px; height:76px; margin:4px auto 8px; color:#06030f; position:relative}
.shc .fig .ic{width:100%; height:100%}
.shc .fig .ic path{fill:#07040f; stroke:var(--vio); stroke-width:3px; paint-order:stroke}
.shc.ext{border-color:color-mix(in srgb, var(--vio) 55%, transparent); background:radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--vio) 22%, transparent), var(--panel) 70%)}

.shc.lock .fig{opacity:.6; filter:saturate(.35)}
.shc.lock .fig .ic path{stroke:color-mix(in srgb, var(--vio) 55%, var(--tx3)); stroke-dasharray:14 10}
.shc.dorm .fig{opacity:.45; animation:none; filter:grayscale(1)}
.shc b{display:block; font-family:var(--f-ep); font-size:13px; line-height:1.2}

.ringp{width:100%; height:5px; background:color-mix(in srgb, var(--vio) 15%, transparent); margin-top:8px}

.shc .rank{position:absolute; top:6px; right:8px; font-size:10.5px; color:var(--vio2); letter-spacing:.04em}

.afk{display:flex; gap:14px; align-items:center; flex-wrap:wrap}

/* ---------- Equipo ---------- */
.doll{display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:10px; align-items:center}

.doll .hero{aspect-ratio:3/4; display:grid; place-items:center; position:relative}

.doll .hero .cls{position:absolute; bottom:0; left:0; right:0; text-align:center; font-family:var(--f-ep); font-size:13px; color:var(--sys)}
.slot{position:relative; aspect-ratio:1; border:1px solid var(--line2); background:var(--panel); display:grid; place-items:center; --rc:var(--line2)}
.slot .ic{width:62%; height:62%; color:var(--rc); filter:drop-shadow(0 0 6px color-mix(in srgb, var(--rc) 70%, transparent))}
.slot.r-rara,.it.r-rara{--rc:var(--c-rara)} .slot.r-epica,.it.r-epica{--rc:var(--c-epica)} .slot.r-legendaria,.it.r-legendaria{--rc:var(--c-legendaria)} .slot.r-mitica,.it.r-mitica{--rc:var(--c-mitica)} .slot.r-comun,.it.r-comun{--rc:var(--c-comun)}
.slot{border-color:color-mix(in srgb, var(--rc) 70%, transparent); box-shadow:inset 0 0 18px color-mix(in srgb, var(--rc) 22%, transparent)}
.slot small{position:absolute; bottom:3px; left:0; right:0; text-align:center; font-size:10px; color:var(--tx3)}

.statl{display:grid; grid-template-columns:auto 1fr auto; gap:8px 10px; align-items:center}
.statl .bar{height:7px; background:color-mix(in srgb, var(--stc) 14%, transparent)}
.statl .bar i{display:block; height:100%; background:var(--stc); box-shadow:0 0 8px var(--stc)}
.statl .nm{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--stc); min-width:118px}
.statl .v{font-variant-numeric:tabular-nums; font-weight:600}
.inv{display:grid; grid-template-columns:repeat(auto-fill, minmax(70px,1fr)); gap:8px}
.it{position:relative; aspect-ratio:1; border:1px solid color-mix(in srgb, var(--rc) 65%, transparent); background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 18%, transparent), var(--panel) 70%); display:grid; place-items:center}
.it .ic{width:58%; height:58%; color:var(--rc); filter:drop-shadow(0 0 5px color-mix(in srgb, var(--rc) 60%, transparent))}
.it.eqd::after{content:""; position:absolute; left:4px; top:4px; width:7px; height:7px; background:var(--ok); transform:rotate(45deg); box-shadow:0 0 6px var(--ok)}
.it.r-legendaria, .slot.r-legendaria{animation:shim 3.2s ease-in-out infinite}
.it.r-mitica, .slot.r-mitica{animation:shimr 2.4s ease-in-out infinite}
@keyframes shim{50%{box-shadow:inset 0 0 22px color-mix(in srgb, var(--c-legendaria) 40%, transparent), 0 0 14px color-mix(in srgb, var(--c-legendaria) 40%, transparent)}}
@keyframes shimr{50%{box-shadow:inset 0 0 24px color-mix(in srgb, var(--c-mitica) 50%, transparent), 0 0 18px color-mix(in srgb, var(--c-mitica) 50%, transparent)}}
.rname{font-family:var(--f-ep); font-weight:700; color:var(--rc)}
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px}
.filters button{flex:none; font-size:12.5px; padding:5px 10px; border:1px solid var(--line); color:var(--tx2)}
.filters button[aria-pressed="true"]{color:var(--sys); border-color:var(--sys)}

/* ---------- Tienda ---------- */
.shop-item{display:flex; gap:12px; align-items:center; padding:12px 4px; border-top:1px solid var(--line)}

/* ---------- Hojas y overlays ---------- */
.sheet-bg{position:fixed; inset:0; z-index:70; background:var(--shade); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}
.sheet{width:min(560px,100%); max-height:86vh; overflow:auto; background:linear-gradient(var(--bg2), var(--bg) 70%); border-top:2px solid var(--sys); padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 40px var(--shade); animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-family:var(--f-ep); font-size:19px; margin:0 0 4px; padding-right:44px}
.sheet{position:relative}
.sheet-x{position:sticky; top:0; float:right; margin:-6px -4px 0 8px; z-index:2; width:38px; height:38px; display:grid; place-items:center; font-size:24px; line-height:1; color:var(--tx2); border:1px solid var(--line2); background:var(--bg2)}
.sheet-x:hover{color:var(--sys); border-color:var(--sys)}
@keyframes up{from{transform:translateY(40px); opacity:0}}
@keyframes fade{from{opacity:0}}
.cine{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:radial-gradient(70% 50% at 50% 40%, color-mix(in srgb, var(--sys) 10%, var(--veil)), var(--veil)); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fade .3s; padding:24px; text-align:center; overflow:auto}
.cine .box{max-width:440px; width:100%}
.sysmsg{border:1px solid var(--sys); background:var(--panel2); padding:14px 16px; margin:0 auto 18px; box-shadow:0 0 30px var(--glow); position:relative; font-size:14.5px}
.sysmsg::before{content:"Sistema"; position:absolute; top:-10px; left:12px; background:var(--panel2); padding:0 6px; font-size:11px; color:var(--sys); letter-spacing:.08em}
.big-num{font-family:var(--f-ep); font-size:64px; font-weight:700; line-height:1; color:var(--sys); text-shadow:0 0 30px var(--sys); animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

.big-num.red{color:var(--red); text-shadow:0 0 30px var(--red)}

@keyframes pop{from{transform:scale(.3); opacity:0}}
.burst{pointer-events:none; width:200px; height:200px; margin:0 auto -150px; border-radius:50%; border:2px solid var(--sys); animation:burst 1s ease-out forwards; opacity:0}
@keyframes burst{0%{transform:scale(.2); opacity:1} 100%{transform:scale(1.6); opacity:0}}
.loot{display:grid; grid-template-columns:repeat(auto-fill, minmax(118px,1fr)); gap:10px; margin:16px 0}
.lcard{border:1px solid color-mix(in srgb, var(--rc,var(--sys)) 70%, transparent); background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rc,var(--sys)) 22%, transparent), var(--panel2) 70%); padding:12px 8px; opacity:0; animation:reveal .5s forwards}
.lcard .ic{width:52px; height:52px; margin:0 auto 6px; color:var(--rc,var(--sys)); filter:drop-shadow(0 0 8px var(--rc,var(--sys)))}
.lcard b{display:block; font-size:12.5px; line-height:1.25}
.lcard small{display:block; font-size:11px; color:var(--rc,var(--tx2))}
@keyframes reveal{from{opacity:0; transform:translateY(12px) scale(.9)} to{opacity:1; transform:none}}
.shatter{position:relative; width:200px; height:200px; margin:0 auto}
.shatter .ic{width:100%; height:100%; color:#04050b}
.shatter .ic path{fill:#04050b; stroke:var(--red); stroke-width:3px; paint-order:stroke}
.shatter .p{position:absolute; inset:0; animation:shard 1.4s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes shard{0%{transform:none; opacity:1; filter:drop-shadow(0 0 14px var(--red))} 30%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}
.arise-word{font-family:var(--f-ep); font-size:clamp(48px,16vw,92px); font-weight:700; letter-spacing:.12em; color:var(--vio2); text-shadow:0 0 30px var(--vio), 0 0 60px var(--vio); animation:arise 2.2s ease-out}
@keyframes arise{0%{opacity:0; letter-spacing:.6em; filter:blur(10px)} 60%{opacity:1; filter:none} 100%{letter-spacing:.12em}}
.rise{width:180px; height:180px; margin:10px auto; color:#05030c; filter:drop-shadow(0 0 16px var(--vio)) drop-shadow(0 0 40px var(--vio)); animation:riseUp 2.4s cubic-bezier(.2,.8,.2,1)}
.rise .ic{width:100%; height:100%} .rise .ic path{fill:#05030c; stroke:var(--vio2); stroke-width:3px; paint-order:stroke}
@keyframes riseUp{0%{transform:translateY(80px) scaleY(.2); opacity:0; filter:blur(8px)} 70%{opacity:1; filter:drop-shadow(0 0 16px var(--vio)) drop-shadow(0 0 40px var(--vio))} 100%{transform:none}}
#fxcanvas{position:fixed; inset:0; z-index:101; pointer-events:none}
.onb{min-height:100vh; display:grid; place-items:center; padding:24px 18px}
.onb .box{width:100%}
.field input,.field select{width:100%; max-width:100%}
.onb h1{font-family:var(--f-ep); font-size:46px; letter-spacing:.14em; margin:0 0 8px; color:var(--sys2); text-shadow:0 0 30px var(--sys)}
.field{display:flex; flex-direction:column; gap:6px; text-align:left; margin:14px 0}
.field label{font-size:13px; color:var(--tx2)}
.quest{border-color:var(--gold)}
.qdays{display:flex; gap:6px; margin:10px 0}
.qdays i{flex:1; height:8px; background:color-mix(in srgb, var(--gold) 15%, transparent)}
.qdays i.ok{background:var(--gold); box-shadow:0 0 8px var(--gold)} .qdays i.ko{background:var(--red)}
.empty{padding:22px 10px; text-align:center; color:var(--tx2)}
.kbd{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important} }
@media (min-width:600px){ main{padding:4px 18px 24px} .gate{margin:4px -18px 0} }

.statl.alloc{grid-template-columns:auto 1fr auto auto}
.pbtn{width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--gold); color:var(--gold); font-weight:700; font-size:18px; line-height:1; transform:rotate(45deg) scale(.8)}
.pbtn:not([disabled]):hover{background:color-mix(in srgb, var(--gold) 18%, transparent); box-shadow:0 0 12px color-mix(in srgb, var(--gold) 50%, transparent)}
.pbtn[disabled]{opacity:.3}
.pbtn span{transform:rotate(-45deg)}
.armrow{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.it.unk{--rc:var(--tx3); border-style:dashed; background:var(--panel)} .it.unk .ic{opacity:.28; filter:none; color:var(--tx3)}
.tier-h h3 .ic{display:inline-block; vertical-align:-3px; margin-right:4px; color:var(--sys)}

/* ---------- Monstruos menores ---------- */
.room{display:flex; align-items:center; gap:8px; padding:8px 10px; margin:6px 0 2px; border:1px solid var(--line); background:var(--panel)}
.room-l{font-family:var(--f-ep); font-weight:700; font-size:13px; margin-right:2px}
.room-r{margin-left:auto; font-size:12px; color:var(--tx2)}
.mini{width:30px; height:30px; display:grid; place-items:center; font-size:24px; color:#06070d; filter:drop-shadow(0 0 1px var(--gold)) drop-shadow(0 0 6px color-mix(in srgb, var(--gold) 55%, transparent))}
.mini .ic path{fill:#06070d; stroke:var(--gold); stroke-width:14px; paint-order:stroke}
.mini.dead{opacity:.3; filter:grayscale(1)}
.mhead{display:flex; align-items:center; gap:8px; padding:6px 8px; margin:-2px 0 6px; border:1px dashed color-mix(in srgb, var(--gold) 45%, transparent); background:color-mix(in srgb, var(--gold) 6%, transparent)}
.mhead .mic{width:30px; height:30px; display:grid; place-items:center; font-size:26px; flex:none; filter:drop-shadow(0 0 6px color-mix(in srgb, var(--gold) 60%, transparent))}
.mhead .mic .ic path{fill:#06070d; stroke:var(--gold); stroke-width:14px; paint-order:stroke}
.mhead .mname{font-size:12.5px; font-weight:600; min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mhead .mhp{flex:1; min-width:50px; height:6px; background:color-mix(in srgb, var(--gold) 14%, transparent); overflow:hidden}
.mhead .mhp i{display:block; height:100%; background:var(--gold); box-shadow:0 0 6px var(--gold); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mhead .mnum{font-size:11px; color:var(--tx2); font-variant-numeric:tabular-nums; min-width:56px; text-align:right}
.mhead.dead{opacity:.55; border-style:solid}
.mhead.dead .mic{filter:grayscale(1)} .mhead.dead .mname{text-decoration:line-through}
.mhead.boss-hit{border-color:color-mix(in srgb, var(--red) 40%, transparent); background:color-mix(in srgb, var(--red) 6%, transparent)}
.mhead.boss-hit .mic{color:var(--red); filter:drop-shadow(0 0 6px color-mix(in srgb, var(--red) 60%, transparent))} .mhead.boss-hit .mic .ic path{fill:currentColor; stroke:none}
.mhead.boss-hit .mname{color:var(--tx2); font-weight:500}
.mhead.kill{animation:killflash .7s ease-out}
@keyframes killflash{0%{background:color-mix(in srgb, var(--gold) 45%, transparent); transform:scale(1.03)} 100%{transform:none}}
.float.kill{color:var(--gold); font-size:15px; font-family:var(--f-ep)}
.rmap{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.rcell{border:1px solid var(--line); padding:6px 2px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:78px}
.rcell .rd{font-size:11px; color:var(--tx2); text-transform:capitalize}
.rcell .ic{width:26px; height:26px; color:var(--tx3)}
.rcell small{font-size:10px; color:var(--tx3); line-height:1.1}
.rcell.clear{border-color:color-mix(in srgb, var(--gold) 60%, transparent)} .rcell.clear .ic{color:var(--gold); filter:drop-shadow(0 0 5px var(--gold))} .rcell.clear small{color:var(--gold)}
.rcell.now{border-color:var(--sys); box-shadow:inset 0 0 12px var(--glow)} .rcell.now .ic{color:var(--sys)}
.rcell.fail{opacity:.55} .rcell.fail .ic{color:var(--red)}
.rcell.future{opacity:.5} .rcell.off{opacity:.35}


/* ---------- Jefe vivo ---------- */
.bart{position:relative; width:100%; height:100%}
.b-aura{position:absolute; inset:6%; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--red) 50%, transparent), transparent 66%); filter:blur(8px); animation:auraP 3.4s ease-in-out infinite}
.b-floor{position:absolute; left:16%; right:16%; bottom:0; height:10%; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.7), transparent); animation:floorP 3.4s ease-in-out infinite}
.b-body{position:absolute; inset:0; transform-origin:50% 92%; animation:breathe 3.4s ease-in-out infinite}
.b-body svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.b-glow path{fill:var(--red); opacity:.55; filter:blur(7px)}
.b-glow{animation:flick 2.3s ease-in-out infinite}
.b-main path{fill:url(#gBoss); stroke:color-mix(in srgb, var(--red) 75%, #fff); stroke-width:5px; paint-order:stroke}
.b-hit{opacity:0} .b-hit path{fill:#fff}
.b-slash{position:absolute; inset:0; pointer-events:none; opacity:0}
.b-slash::before{content:""; position:absolute; left:-12%; right:-12%; top:47%; height:4px; background:linear-gradient(90deg, transparent, #fff 50%, transparent); box-shadow:0 0 14px #fff, 0 0 30px var(--red); transform:rotate(-28deg)}
.bart.hit .b-body{animation:recoil .5s cubic-bezier(.2,.8,.2,1), breathe 3.4s ease-in-out .5s infinite}
.bart.hit .b-hit{animation:hflash .45s ease-out}
.bart.hit .b-main{animation:chroma .45s ease-out}
.bart.hit .b-slash{animation:slashX .42s ease-out}
.bart.dead .b-body{animation:none; filter:grayscale(1); opacity:.35} .bart.dead .b-aura, .bart.dead .b-glow{display:none}
@keyframes breathe{0%,100%{transform:none} 35%{transform:scale(1.014,1.04) translateY(-1.4%) rotate(-.7deg)} 65%{transform:scale(1.006,1.018) translateY(-.6%) rotate(.6deg)}}
@keyframes auraP{50%{opacity:.55; transform:scale(1.1)}}
@keyframes floorP{35%{transform:scaleX(.9); opacity:.75}}
@keyframes flick{0%,100%{opacity:.9} 30%{opacity:.55} 50%{opacity:1} 70%{opacity:.65}}
@keyframes recoil{0%{transform:none} 12%{transform:translate(7%,-2%) rotate(6deg) scale(.96)} 35%{transform:translate(-3%,0) rotate(-2deg)} 60%{transform:translate(1.5%,0)} 100%{transform:none}}
@keyframes hflash{0%{opacity:.95} 100%{opacity:0}}
@keyframes chroma{0%{filter:drop-shadow(5px 0 0 rgba(0,220,255,.85)) drop-shadow(-5px 0 0 rgba(255,0,60,.85))} 100%{filter:none}}
@keyframes slashX{0%{opacity:1; clip-path:inset(0 100% 0 0)} 45%{opacity:1; clip-path:inset(0 0 0 0)} 100%{opacity:0}}
.boss-stage{position:relative; width:62%; aspect-ratio:1; cursor:pointer; z-index:1}
.embers{position:absolute; inset:10%; pointer-events:none; border-radius:50%; overflow:hidden; z-index:2}
.embers i{position:absolute; bottom:12%; left:var(--x); width:var(--s); height:var(--s); border-radius:50%; background:var(--pc); box-shadow:0 0 6px var(--pc), 0 0 12px var(--pc); opacity:0; animation:ember var(--d) linear infinite; animation-delay:var(--dl)}
.portal:not(.redg) .embers i{background:color-mix(in srgb, var(--red) 60%, var(--gold)); box-shadow:0 0 8px var(--red)}
@keyframes ember{0%{transform:translate(0,0); opacity:0} 15%{opacity:.95} 100%{transform:translate(var(--dx),-230px); opacity:0}}
.bstrip .bport{width:64px; height:64px; font-size:inherit; filter:none; flex:none}
.bstrip .bport .b-main path{stroke-width:9px}
/* ---------- Subpestañas ---------- */
.subtabs{display:flex; width:100%; margin:8px 0 2px}
.subtabs button{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 8px; font-size:13.5px; font-weight:600}
.subtabs button .ic{font-size:16px}
.subtabs button.locked{color:var(--tx3)}
.subtabs button.red[aria-pressed="true"]{background:var(--red); color:#fff}
.badge{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:11px}
.subtabs button[aria-pressed="true"] .badge{background:var(--bg); color:var(--sys)}
/* ---------- Semana ---------- */
.wk{display:grid; grid-template-columns:minmax(0,1fr) repeat(7,14px) 46px; gap:4px; align-items:center; padding:6px 0; border-top:1px solid var(--line)}
.wk-head{border-top:0; padding-top:0; font-size:11px; color:var(--tx3)} .wk.wk-head > i{font-style:normal; text-align:center; transform:none; border:0; width:auto; height:auto; background:none; box-shadow:none} .wk-head span:last-child{text-align:right}
.wk-n{display:flex; align-items:center; gap:7px; min-width:0}
.wk-n .ic{font-size:18px; color:var(--stc)} .wk-n > span{min-width:0} .wk-n b{display:block; font-size:12.5px; font-weight:600; line-height:1.2} .wk-n small{display:block; font-size:10.5px; color:var(--tx3)}
.wk > i{width:12px; height:12px; margin:0 auto; transform:rotate(45deg); border:1px solid var(--line2)}
.wk > i.ok{background:var(--sys); border-color:var(--sys); box-shadow:0 0 6px var(--glow)}
.wk > i.pr{border-color:var(--vio); border-style:dashed}
.wk > i.ko{border-color:color-mix(in srgb, var(--red) 60%, transparent); background:color-mix(in srgb, var(--red) 16%, transparent)}

.rspill{opacity:.4; filter:blur(18px); transform-origin:100px 122px; animation:rspill 2.8s ease-in-out infinite}
@keyframes rpulse{0%,100%{opacity:.78} 50%{opacity:1}}
@keyframes rspill{0%,100%{opacity:.35; transform:scale(.92)} 50%{opacity:.7; transform:scale(1.05)}}
.rstage.st-active .rglyph{animation:rpulse 1.1s ease-in-out infinite} .rstage.st-active .rspill{animation:rspill 1.1s ease-in-out infinite}

.rstage.rburst .rwave{animation:rwave .8s ease-out} .rstage.rburst .rwave.w2{animation:rwave .8s .15s ease-out}

@keyframes rflare{0%{opacity:1; filter:brightness(3)} 100%{filter:none}}
@keyframes rwave{0%{transform:scale(.4); opacity:1} 100%{transform:scale(4.2); opacity:0}}
.rcd{position:absolute; width:46%; aspect-ratio:1; left:27%; top:30%; border-radius:50%; background:conic-gradient(var(--gc) var(--p), rgba(255,255,255,.08) 0); -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%); mask:radial-gradient(circle, transparent 58%, #000 60%)}

.rbar{display:flex; gap:10px}

.rgrid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}

const invGet = (s,uid) => s.inv.find(x=>x.uid===uid);

function addGold(s, n, src){ n = Math.round(n); if (!n) return 0; s.gold += n; if (n>0 && (src==='act' || src==='lvl')) { const L = wledger(s, src==='act'?'Hábitos':'Niveles'); L.gold = (L.gold||0) + n; } if (n>0) s.goldLog.push([today(), n, src]); if (s.goldLog.length>400) s.goldLog = s.goldLog.slice(-300); return n; }

// ---- Protección y estado del día ----
function inEstasis(s, d){ return s.estasis.some(e => d>=e.from && d<=e.to); }
function inVendas(s, d){ return (s.vendas||[]).some(e => d>=e.from && d<=e.to); }
function estasisDaysYear(s, y){ let n = 0; for (const e of s.estasis) for (let d=e.from; d<=e.to; d=addD(d,1)) if (d.startsWith(y)) n++; return n; }
function protShort(s, d, hid){
  const dy = dayR(s,d); const h = HB[hid];
  if (inEstasis(s,d) && !TRAVEL.some(t=>t.id===hid)) return 'Estasis';
  if (inVendas(s,d) && VENDAS_H.includes(hid)) return 'Vendas del Guerrero Herido';
  if (dy && hid==='grasa' && dy.libre) return 'Comida libre';
  if (dy && dy.frz) return 'Sello del Descanso';
  if (dy && h && dy.sh[h.s]) return 'Escudo de '+h.s;
  return null;
}
function protReason(s, d, hid){
  const dy = dayR(s,d); const h = HB[hid];
  if (inEstasis(s,d) && !TRAVEL.some(t=>t.id===hid)) return 'Día en estasis: no hace falta marcarlo';
  if (inVendas(s,d) && VENDAS_H.includes(hid)) return 'Protegido por las Vendas del Guerrero Herido';
  if (dy && hid==='grasa' && dy.libre) return 'Protegido por la comida libre: quítala si quieres marcarlo';
  if (dy && dy.frz) return 'Día protegido por el Sello del Descanso';
  if (dy && h && dy.sh[h.s]) return 'Protegido por el Escudo de '+h.s;
  return null;
}
function isProtected(s, d, hid){
  const dy = dayR(s,d); if (inEstasis(s,d)) return true; if (inVendas(s,d) && VENDAS_H.includes(hid)) return true; if (!dy) return false; if (hid==='grasa' && dy.libre) return true;
  if (dy.frz) return true; const h = HB[hid]; return !!(h && dy.sh[h.s]);
}
const done = (s,d,hid) => !!(dayR(s,d) && dayR(s,d).c[hid]);
const fulfilled = (s,d,hid) => done(s,d,hid) || isProtected(s,d,hid);
const libreDay = (s,d,hid) => hid==='grasa' && !!(dayR(s,d) && +dayR(s,d).libre > 0);
function roomClear(s, d){
  if (inEstasis(s,d) || d < s.start) return false;
  return DAILY.every(h => done(s,d,h.id) || isProtected(s,d,h.id));
}
function roomFull(s, d){ // todos marcados sin protecciones
  const dy = dayR(s,d); if (!dy || inEstasis(s,d) || dy.frz || Object.keys(dy.sh).length) return false;
  return DAILY.every(h => dy.c[h.id]);
}
function weekCount(s, ws, hid, uptoD){
  let n=0; for (let i=0;i<7;i++){ const d = addD(ws,i); if (uptoD && d>uptoD) break; if (done(s,d,hid)) n++; } return n;
}
function pesasOrder(s, d, hid){ // posición de esta sesión entre las de pesas de la semana
  const ws = wstart(d); const arr=[];
  for (let i=0;i<7;i++){ const dd = addD(ws,i); const dy = dayR(s,dd); if (!dy) continue;
    for (const p of PESAS) if (dy.c[p]) arr.push([dd, dy.t[p]||0, p]); }
  arr.sort((a,b)=> a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1]);
  return arr.findIndex(x=>x[0]===d && x[2]===hid)+1;
}
function condOk(s, c, d, hid){
  if (!c) return true; const dy = dayR(s,d) || {c:{}, sub:{}};
  const base = hid && hid.split(':')[0];
  switch(c){

        else if (!w.event && !inEstasisWeek(s,ws)) { const alive = w.bosses.find((x,i)=>!b.bosses[i].dead); if (alive) { fug = {id:alive.id}; events.push({type:'fug', boss:alive.id}); } }
      }

}

}
const thawNeed = (sh, h, s) => { const b = (h && h.w ? THAW_W : THAW_D)[sh.rank||0]; return s && s.pets ? Math.max(1, Math.round(b*(1-petSum(s,'thaw')/100))) : b; };

// ---- AFK ----
function afkRates(s){

  let g=0, e=0; for (const [,v] of ext) { g += SH_GOLD[v.rank]; e += SH_ESS[v.rank]; }
  let m = 1; for (const x of allFx(s,null)) if (x.t==='afk') m += x.pct/100;
  const w = weekOf(s,today()); if (w && w.event && EVENTS[w.event].afk) m *= EVENTS[w.event].afk;
  return {gold:g*m, ess:e*m, wage:false};
}

  const afk7 = s.goldLog.filter(x=>x[0]>cut && x[2]==='afk').reduce((a,x)=>a+x[1],0);
  const capLeft = Math.max(0, Math.floor(active*(0.5 + petSum(s,'afkCap')/100)) - afk7);
  const full = now - s.afk.last >= 24*3600e3;
  return {gold: r.wage ? Math.floor(g) : Math.min(Math.floor(g), capLeft), rawGold:g, ess:e, full, capLeft, rates:r, hours: Math.min(24,(now - s.afk.last)/3600e3)};
}

  if (L.cores) loot.cores = fracAmount(L.cores*m);
  if (L.frags) loot.frags = fracAmount(L.frags*m);
  if (L.bayas) { const n = fracAmount(L.bayas*m); petInit(s); s.bayas += n; loot.bayas = n; }
  if (L.cobre && ok && Math.random() < Math.min(0.6, L.cobre*m)) { s.bag.cobre = (s.bag.cobre||0)+1; loot.cobre = 1; }
  if (L.piece) { const n = fracAmount(L.piece*m); for (let i=0;i<n;i++) loot.items.push(rollPiece(s, rollRar(lv))); }
  if (L.item && Math.random() < Math.min(0.95, L.item[0]*m)) loot.items.push(rollPiece(s, L.item[1]));
  if (L.rune && Math.random() < Math.min(0.95, L.rune*m)) loot.runes.push(rollRune());
  if (L.myth && Math.random() < Math.min(0.5, L.myth*m)) loot.items.push('m_'+(s.cls || pick(Object.keys(CLASSES))));

}

  const ok = e.half ? true : Math.random()*100 < e.ch; const L0 = expLoot(s, DEST[e.dest], e.lv, ok, e.half?0.5:1);
  if (ok && !e.half && Math.random() < EXP_EGG_P[e.lv]) L0.eggs = [{egg: pick(EXP_EGGS[e.dest] || EGG_ORDER)}];
  const loot = grantLoot(s, L0, 'Exped');
  s.exps = s.exps.filter(x=>x.id!==id); s.expDone = (s.expDone||0) + 1; if (ok && e.lv===4) s.expV = 1;
  return {ok, loot, e};
}

// ---- Estadísticas para los logros ----
function achStats(s){
  const t = today(); const st = {bestRoom:0, pesas:0, chino:0, lectura:0, pasos:0, sueno:0};
  let run = 0;
  for (let d = s.start; d <= t; d = addD(d,1)) {
    if (roomClear(s,d)) { run++; st.bestRoom = Math.max(st.bestRoom, run); } else if (d < t) run = 0;
    const dy = dayR(s,d); if (!dy) continue;
    st.pesas += (dy.c.torso?1:0) + (dy.c.pierna?1:0); if (dy.c.chino) st.chino++; if (dy.c.lectura) st.lectura++; if (dy.c.pasos) st.pasos++; if (dy.c.sueno) st.sueno++;
  }
  st.kills = Object.values(s.kills).reduce((a,b)=>a+b,0);
  st.fug = s.fugKill ? 1 : 0; st.asc = s.ascKill ? 1 : 0; st.red = s.titles.includes('roja') ? 1 : 0;
  const ex = Object.entries(s.shadows).filter(([,v])=>v.ext); st.shadows = ex.length;
  st.mariscal = ex.some(([,v])=>v.rank>=4) ? 1 : 0; st.shPlan = s.shadows.plan && s.shadows.plan.ext ? 1 : 0; st.shChino = s.shadows.chino && s.shadows.chino.ext ? 1 : 0;
  st.armory = Math.floor(Object.keys(s.seen||{}).length / Object.keys(ITEMS).length * 100);
  st.set6 = Math.max(0, ...Object.values(setCounts(s)));
  st.runes = RUNES.filter(r=>r.r!=='evento' && runeLevel(s,r.id)).length; st.runeMax = Math.max(0, ...RUNES.map(r=>runeLevel(s,r.id)));
  const ws = Object.keys(s.weeks).filter(w=>s.weeks[w].resolved).sort(); let pr = 0; st.perfect = 0; st.perfectRun = 0;
  for (const w of ws) { if (weekPerfect(s,w)) { st.perfect++; pr++; st.perfectRun = Math.max(st.perfectRun, pr); } else pr = 0; }
  st.missions = s.mDone || 0; st.expV = s.expV ? 1 : 0; st.cls = s.cls ? 1 : 0; st.rank = curRank(s);
  st.daysPlayed = diffD(s.start, t) + 1;
  return st;
}
function achProgress(s, st){ return ACHS.map(a=>{ const [cur,max] = a.test(st); return {a, cur:Math.min(cur,max), max, done: !!(s.ach && s.ach[a.id])}; }); }
function checkAchievements(s, events){
  if (s.start > today()) return;
  s.ach = s.ach || {}; s.cos = s.cos || []; const st = achStats(s); const got = [];
  for (const a of ACHS) { if (s.ach[a.id]) continue; const [cur,max] = a.test(st); if (cur < max) continue;
    s.ach[a.id] = today(); if (a.title && !s.titles.includes(a.title)) s.titles.push(a.title);
    if (a.rw.gold) addGold(s, a.rw.gold, 'loot'); if (a.rw.ess) s.ess += a.rw.ess; if (a.rw.cores) s.cores += a.rw.cores;
    if (a.cos) { const k = a.cos[0]+':'+a.cos[1]; if (!s.cos.includes(k)) s.cos.push(k); }
    got.push(a.id); }
  if (got.length) events.push({type:'ach', ids:got});
}

function frameSVG(f){

function auraHTML(a){
  if (a==='none') return '';

// ---- Desglose de una stat ----
function statSheet(st){
  const I = STAT_INFO[st]; const xp = S.statXp[st]||0; const fromXp = Math.floor(xp/50); const pts = (S.pts||{})[st]||0; const eq = statVal(S, st, true); const pet = Math.round(petSum(S,'stat',b=>b.s===st)); const total = fromXp + pts + eq + pet;
  const parts = [['Hábitos', fromXp, `${nf(xp)} XP en ${st} · 1 punto cada 50 XP`, I.c], ['Puntos libres', pts, 'Los que has repartido al subir de nivel', 'var(--gold)'], ['Equipo', eq, 'La suma de tus piezas equipadas', 'var(--sys)'], ['Mascotas', pet, 'Las mascotas épicas del Altar', '#ff8ad8']];
  const hs = HABITS.filter(h=>h.s===st);
  return `<div style="text-align:center"><span class="statbig" style="--stc:${I.c}">${ic(I.ic)}</span><h3>${I.n}</h3><div class="big-num" style="font-size:52px; color:${I.c}; text-shadow:0 0 24px ${I.c}">${total}</div>
    <p class="small muted" style="margin:4px 0 12px">Los hábitos de ${st} hacen un +${total} % de daño al jefe.</p></div>
    <div class="sbar">${parts.filter(p=>p[1]>0).map(p=>`<i style="flex:${p[1]}; background:${p[3]}"></i>`).join('') || '<i style="flex:1; background:var(--line)"></i>'}</div>
    <div class="win" style="--stc:${I.c}">${parts.map(p=>`<div class="sline"><span class="sdot" style="background:${p[3]}"></span><div style="flex:1"><b>${p[0]}</b><small>${p[2]}</small></div><b class="sval">${p[1]}</b></div>`).join('')}
      <div class="tiny" style="margin-top:8px">Próximo punto por hábitos: ${xp%50} / 50 XP</div><span class="ach-bar" style="--gold:${I.c}"><i style="width:${(xp%50)/50*100}%"></i></span></div>
    <p class="tiny" style="margin:0 2px">Hábitos de ${st}: ${hs.map(h=>esc(h.n)).join(', ')}.</p>`;
}

// ---- Migración: reparte la XP de stat ya ganada con el reparto nuevo ----
function migrate17(s){
  const sx = {FUE:0, AGI:0, VIT:0, INT:0, PRE:0};
  for (const d in s.days) { const dy = s.days[d];
    for (const k in dy.xp) { const [base, sub] = k.split(':'); const h = HB[base]; if (!h) continue; sx[sub ? 'FUE' : h.s] += dy.xp[k]; }
    const bx = dy.bonus && dy.bonus.sx; if (bx) for (const st in bx) sx[st] = (sx[st]||0) + bx[st]; }
  s.statXp = sx; s.mig17 = true;
}

const EXP_EGGS = {cueva:['cristal','roca'], mina:['hierro','roca','cristal'], bosque:['raiz','viento','cosecha'], templo:['marea','lunar','raiz'], puerto:['marea','cosecha'], cripta:['lunar','tinta'], abismo:['trueno','viento'], biblioteca:['tinta','alba'], nido:['trueno','hierro','alba'], trono:EGG_ORDER};
const EXP_EGG_P = [0.10,0.15,0.20,0.25,0.30];

// ---- Estado ----
function petInit(s){ s.pets = s.pets||[]; s.eggs = s.eggs||[]; s.inc = s.inc||[]; s.bayas = s.bayas||0; s.esq = s.esq||{}; s.ofr = s.ofr||{}; s.petAct = s.petAct||[]; }
const petSlots = s => curRank(s) >= 3 ? 2 : 1;
function petMult(s, pi){ const P = PET[pi.id]; let m = (1 + 0.2*(pi.stars||0)) * (pi.shiny ? 1.1 : 1);
  if (P.ev && eventFor(wstart(today()))===P.ev) m *= 2; return m; }
function petVal(s, pi){ return PET[pi.id].v[pi.stage||0] * petMult(s, pi); }
function activePets(s){ petInit(s); return s.petAct.map(u=>s.pets.find(p=>p.uid===u)).filter(Boolean); }
// Bonus que no son efectos estándar
function petSum(s, t, extra){ let v = 0; for (const pi of activePets(s)) { const b = PET[pi.id].b; if (b.t===t && (!extra || extra(b))) v += petVal(s,pi); } return v; }
// Bonus que entran en el sistema de efectos
function petFx(s){
  const fx = [];
  for (const pi of activePets(s)) { const b = PET[pi.id].b; const v = petVal(s,pi);
    if (b.t==='xpH') fx.push({t:'xp', h:b.h, pct:v});
    if (b.t==='xpS') fx.push({t:'xp', s:b.s, pct:v});
    if (b.t==='gxp') fx.push({t:'gxp', pct:v});
    if (b.t==='ggold') fx.push({t:'ggold', pct:v});
    if (b.t==='gxpgold') { fx.push({t:'gxp', pct:v}); fx.push({t:'ggold', pct:v}); }
    if (b.t==='dmgH') fx.push({t:'dmg', h:b.h, x:1+v/100});
    if (b.t==='dmgAll') fx.push({t:'dmg', h:HABITS.map(h=>h.id), x:1+v/100});
    if (b.t==='afk') fx.push({t:'afk', pct:v});
    if (b.t==='forge') fx.push({t:'forge', pct:Math.min(60,v)}); }
  return fx;
}

// ---- Huevos ----
function addEgg(s, egg, ev){ petInit(s); s.eggs.push({uid:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), egg, ev:ev||null}); }
function randomEgg(){ return pick(EGG_ORDER); }
function blockDone(s, d, b){ const hs = BLOCK_H(b); return hs.length && hs.every(h=>fullDone(s,d,h)); }
function incProgress(s, inc){
  const E = EGGS[inc.egg]; const c = E.cond; let n = 0; const t = today();
  for (let d=inc.start; d<=t; d=addD(d,1)) {
    if (c.t==='block' && blockDone(s,d,c.b)) n++;
    if (c.t==='habit' && done(s,d,c.h)) n++;
    if (c.t==='rooms' && roomClear(s,d)) n++; }
  n += inc.bonus||0; return {cur:Math.min(n,c.n), need:c.n};
}
function incubate(s, uid){ petInit(s); if (s.inc.length >= 2) return {ok:false, why:'La incubadora está llena (2 huevos)'};
  const i = s.eggs.findIndex(e=>e.uid===uid); if (i<0) return {ok:false, why:'No encontrado'};
  const e = s.eggs.splice(i,1)[0]; s.inc.push(Object.assign(e, {start:today()})); return {ok:true}; }
function releaseEgg(s, uid){ petInit(s); const i = s.eggs.findIndex(e=>e.uid===uid); if (i<0) return {ok:false}; s.eggs.splice(i,1); s.bayas += 5; return {ok:true}; }
function hatch(s, uid){
  petInit(s); const i = s.inc.findIndex(e=>e.uid===uid); if (i<0) return {ok:false, why:'No encontrado'};
  const inc = s.inc[i]; const pr = incProgress(s, inc); if (pr.cur < pr.need) return {ok:false, why:'Aún no está listo'};
  s.inc.splice(i,1);
  let P;
  if (inc.egg==='evento') P = PETS.find(p=>p.ev===inc.ev);
  else { const opts = PETS.filter(p=>p.egg===inc.egg); const x = Math.random()*100; const rar = x<50?'c':x<80?'r':'e'; P = opts.find(p=>p.rar===rar); }
  const shiny = !P.ev && Math.random() < 0.05;
  const isNew = !s.pets.some(p=>p.id===P.id && !!p.shiny===shiny);
  const pi = {uid:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), id:P.id, stage:0, food:0, stars:0, shiny};
  s.pets.push(pi); s.codex = s.codex||{}; s.codex[P.id+(shiny?'*':'')] = 1;
  if (!s.petAct.length) s.petAct.push(pi.uid);
  return {ok:true, pi, isNew};
}
// ---- Crecer ----
function feedPet(s, uid, n){
  petInit(s); const pi = s.pets.find(p=>p.uid===uid); if (!pi) return {ok:false};
  if (pi.stage >= 2) return {ok:false, why:'Ya es adulta'}; if (s.bayas <= 0) return {ok:false, why:'No tienes Bayas Lunares'};
  const goal = PET_FOOD[pi.stage]; const use = Math.min(s.bayas, n||1, goal - pi.food); s.bayas -= use; pi.food += use;
  let evolved = false; if (pi.food >= goal) { pi.stage++; evolved = true; }
  return {ok:true, evolved, stage:pi.stage};
}
// ---- Copias, estrellas y fusión ----
const copiesOf = (s, pi) => s.pets.filter(p=>p.uid!==pi.uid && p.id===pi.id && !s.petAct.includes(p.uid));
function fusePet(s, uid){
  const pi = s.pets.find(p=>p.uid===uid); if (!pi) return {ok:false}; if ((pi.stars||0) >= 3) return {ok:false, why:'Ya tiene 3 estrellas'};
  const cost = STAR_COST[pi.stars||0]; const cps = copiesOf(s, pi).sort((a,b)=>(a.stage-b.stage)||(a.shiny-b.shiny));
  const evc = PET[pi.id].ev ? ((s.esq[PET[pi.id].ev]||0) >= 5 ? Math.floor(s.esq[PET[pi.id].ev]/5) : 0) + (s.ofr[PET[pi.id].ev]||0) : 0;
  if (cps.length + evc < cost) return {ok:false, why:`Necesitas ${cost} ${cost===1?'copia':'copias'}`};
  let need = cost;
  while (need > 0 && cps.length) { const c = cps.shift(); if (c.stars > pi.stars && c.shiny===pi.shiny) pi.stars = c.stars; s.pets = s.pets.filter(p=>p.uid!==c.uid); need--; }
  const ev = PET[pi.id].ev;
  while (need > 0 && ev && (s.ofr[ev]||0) > 0) { s.ofr[ev]--; need--; }
  while (need > 0 && ev && (s.esq[ev]||0) >= 5) { s.esq[ev] -= 5; need--; }
  pi.stars = Math.min(3, (pi.stars||0)+1); return {ok:true, stars:pi.stars};
}
function shinyFuse(s, uid){
  const sh = s.pets.find(p=>p.uid===uid); if (!sh || !sh.shiny) return {ok:false};
  const normal = s.pets.filter(p=>p.id===sh.id && !p.shiny && p.uid!==uid).sort((a,b)=>(b.stars-a.stars)||(b.stage-a.stage))[0];
  if (!normal) return {ok:false, why:'No tienes la versión normal'};
  sh.stars = Math.max(sh.stars||0, normal.stars||0); sh.stage = Math.max(sh.stage, normal.stage); sh.food = Math.max(sh.food, normal.food);
  s.petAct = s.petAct.map(u=>u===normal.uid?sh.uid:u).filter((u,i,a)=>a.indexOf(u)===i);
  s.pets = s.pets.filter(p=>p.uid!==normal.uid); return {ok:true};
}
const BAYAS_REL = {c:10, r:20, e:35, ev:35};
function releasePet(s, uid){ const pi = s.pets.find(p=>p.uid===uid); if (!pi) return {ok:false}; if (s.petAct.includes(uid)) return {ok:false, why:'Está activa'};
  s.pets = s.pets.filter(p=>p.uid!==uid); const n = BAYAS_REL[PET[pi.id].rar]; s.bayas += n; return {ok:true, n}; }
function setActive(s, uid){ petInit(s); if (s.petAct.includes(uid)) { s.petAct = s.petAct.filter(u=>u!==uid); return {ok:true}; }
  if (s.petAct.length >= petSlots(s)) s.petAct.shift(); s.petAct.push(uid); return {ok:true}; }
// ---- Comida libre ----
// Comidas libres: 3 por semana, en uno o varios días; cualquier comida libre protege la grasa saturada de ese día
function libreWeek(s, d){ const ws = wstart(d); let n = 0; for (let i=0;i<7;i++){ const dy = dayR(s, addD(ws,i)); if (dy && dy.libre) n += +dy.libre; } return n; }
function addLibre(s, d, delta){ const dy = day(s,d); const cur = +dy.libre||0;
  if (delta > 0) { if (libreWeek(s,d) >= 3) return {ok:false, why:'Ya usaste las 3 comidas libres de esta semana'}; if (dy.c.grasa) return {ok:false, why:'Ya marcaste la grasa saturada controlada'}; dy.libre = cur + 1; }
  else { if (!cur) return {ok:false, why:'Ese día no hay comidas libres'}; dy.libre = cur - 1; if (!dy.libre) delete dy.libre; }
  return {ok:true}; }
function toggleLibre(s, d){ const dy = day(s,d); return addLibre(s, d, (+dy.libre||0) ? -1 : 1); }

// ===================== INTERFAZ =====================
function eggSVG(egg, prog, cls){
  const E = EGGS[egg]; const id = 'eg'+egg+Math.random().toString(36).slice(2,6);
  const pats = {rays:'<path d="M50 30 L50 18 M38 36 L30 28 M62 36 L70 28" stroke-width="3"/>', swirl:'<path d="M32 60 Q50 44 68 60 M36 78 Q50 66 64 78" stroke-width="3" fill="none"/>', roots:'<path d="M50 96 L50 70 L40 58 M50 74 L62 62 M40 58 L34 50" stroke-width="3" fill="none"/>',
    moons:'<path d="M40 50 a8 8 0 1 0 8 -10 a6 6 0 1 1 -8 10" stroke-width="2.5"/><circle cx="62" cy="74" r="3"/>', plates:'<path d="M28 58 H72 M30 76 H70" stroke-width="4"/>', strata:'<path d="M26 56 Q50 50 74 56 M24 72 Q50 66 76 72 M30 86 Q50 82 70 86" stroke-width="3" fill="none"/>',
    ink:'<path d="M42 44 Q52 54 44 64 Q38 74 52 82" stroke-width="4" fill="none"/>', grain:'<path d="M50 40 V84 M50 50 L42 44 M50 50 L58 44 M50 62 L42 56 M50 62 L58 56 M50 74 L42 68 M50 74 L58 68" stroke-width="2.6" fill="none"/>',
    waves:'<path d="M28 58 Q36 52 44 58 T60 58 T76 58 M26 74 Q34 68 42 74 T58 74 T74 74" stroke-width="3" fill="none"/>', facets:'<path d="M50 22 L34 56 L50 98 L66 56 Z M34 56 H66" stroke-width="2.4" fill="none"/>',
    bolts:'<path d="M54 34 L42 60 H54 L46 86" stroke-width="4" fill="none"/>', stars:'<path d="M50 40 l4 10 10 1 -8 7 3 10 -9 -6 -9 6 3 -10 -8 -7 10 -1z" stroke-width="2"/>'};
  const k = prog||0; const cracks = (k>0.33?'<path d="M30 64 L38 60 L42 66 L50 61" />':'') + (k>0.66?'<path d="M58 44 L64 50 L60 56 L68 60" /><path d="M40 82 L46 78 L52 84" />':'');
  return `<svg class="egg ${cls||''} ${k>=1?'ready':''}" viewBox="0 0 100 118" aria-hidden="true"><defs><radialGradient id="${id}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${E.c1}"/><stop offset="1" stop-color="${E.c2}"/></radialGradient></defs>
    <ellipse cx="50" cy="110" rx="26" ry="5" fill="#000" opacity=".35"/><path d="M50 8 C76 8 90 52 90 74 C90 98 72 112 50 112 C28 112 10 98 10 74 C10 52 24 8 50 8 Z" fill="url(#${id})" stroke="${E.c2}" stroke-width="2"/>
    <g stroke="#fff" fill="#fff" opacity=".55">${pats[E.pat]}</g><g stroke="#140c26" stroke-width="2.4" fill="none" stroke-linejoin="round">${cracks}</g>
    <ellipse cx="36" cy="34" rx="8" ry="13" fill="#fff" opacity=".35" transform="rotate(-20 36 34)"/></svg>`;
}
function petArt(pi, cls){
  const P = PET[pi.id]; const E = EGGS[P.egg]; const st = pi.stage||0;
  const c1 = pi.shiny ? '#ffffff' : E.c1, c2 = pi.shiny ? '#ff8ad8' : E.c2;
  const drift = st===2 ? '<span class="drift"><i></i><i></i><i></i><i></i><i></i></span>' : '';
  return `<span class="pet st${st} ${pi.shiny?'shiny':''} ${cls||''}" style="--c1:${c1}; --c2:${c2}">${st?'<span class="pet-aura"></span>':''}${drift}<span class="pet-ic">${ic(P.ic)}</span></span>`;
}
const starsHTML = n => n ? `<span class="pstars">${'★'.repeat(n)}</span>` : '';
let SANF = 'todo';
function screenSantuario(){
  petInit(S); const act = activePets(S);
  let html = `<div class="sys-title"><h1>Santuario</h1><span class="sub nowrap">${ic('round-potion')}<b>${nf(S.bayas)}</b> Bayas Lunares</span></div>`;
  html += `<section class="win altar"><div class="wh" style="color:var(--vio)">${ic('crystal-shine')}<h2>Altar</h2><span class="prog">${act.length}/${petSlots(S)} activas</span></div>`;
  if (!act.length) html += `<p class="small muted">Aún no tienes mascotas. Incuba un huevo para que nazca la primera: los huevos caen de los jefes, de las expediciones y del Mercader.</p>`;
  html += `<div class="altar-row">${act.map(pi=>{ const P = PET[pi.id]; const goal = PET_FOOD[pi.stage];
    return `<button class="altar-pet" data-act="pet" data-v="${pi.uid}"><span class="circle"></span>${petArt(pi,'xl')}<b>${esc(P.n)}${starsHTML(pi.stars)}</b><small>${PET_STAGE[pi.stage]}${pi.shiny?' · ✨ shiny':''} · +${fmtV(petVal(S,pi))}${P.txt}</small>
      ${pi.stage<2?`<span class="ach-bar" style="--gold:var(--vio)"><i style="width:${pi.food/goal*100}%"></i></span><small class="tiny">${pi.food}/${goal} Bayas para ${PET_STAGE[pi.stage+1]}</small>`:''}</button>`; }).join('')}</div>`;
  if (act.some(pi=>pi.stage<2)) html += `<div class="row" style="justify-content:center; margin-top:8px">${act.filter(pi=>pi.stage<2).map(pi=>`<button class="btn vio sm" data-act="feed" data-v="${pi.uid}" ${S.bayas?'':'disabled'}>${ic('round-potion')}Dar Bayas a ${esc(PET[pi.id].n.split(' ')[0])}</button>`).join('')}</div>`;
  html += `</section>`;
  html += `<section class="win"><div class="wh">${ic('hourglass')}<h2>Incubadora</h2><span class="prog">${S.inc.length}/2</span></div><div class="incub">${[0,1].map(i=>{ const inc = S.inc[i];
    if (!inc) return `<div class="pod empty"><span class="pod-glass"></span><small>Vacía</small></div>`;
    const pr = incProgress(S,inc); const k = pr.cur/pr.need; const E = EGGS[inc.egg];

  html += ofrAltar();

  html += `<section class="win"><div class="wh">${ic('locked-chest')}<h2>Redil</h2><button class="btn sm" data-act="codex">${ic('spell-book')}Codex · ${Object.keys(S.codex||{}).length}/${PETS.length}</button></div>
    <div class="field" style="margin:0 0 6px"><label for="sanf">Mostrar</label><select id="sanf" data-chg="sanf">${fl.map(f=>`<option value="${f}" ${SANF===f?'selected':''}>${f==='todo'?'Todos los huevos':f==='evento'?'Huevos de evento':esc(EGGS[f].n)}</option>`).join('')}</select></div>`;
  const eggs = S.eggs.filter(e=>SANF==='todo'||e.egg===SANF); const pets = S.pets.filter(p=>SANF==='todo'||PET[p.id].egg===SANF);

  html += pets.length ? `<div class="tier-h"><h3>Mascotas</h3><span class="tiny">${pets.length}</span></div><div class="pgrid">${pets.map(pi=>`<button class="ptile ${S.petAct.includes(pi.uid)?'on':''}" data-act="pet" data-v="${pi.uid}" style="--rc:${RAR_P[PET[pi.id].rar].col}">${(pi.stars||0)<3 && petCopies(pi)>0 ? `<span class="pcopy" title="Copias para fusionar">${petCopies(pi)}</span>` : ''}${petArt(pi,'md')}<small>${esc(PET[pi.id].n)}${starsHTML(pi.stars)}</small><span class="tiny">${PET_STAGE[pi.stage]}</span></button>`).join('')}</div>` : '';
  if (!eggs.length && !pets.length) html += `<p class="small muted">Nada por aquí todavía.</p>`;
  html += `</section>`;
  return html;
}
const fmtV = v => (Math.round(v*10)/10).toString().replace('.',',');

function codexSheet(){
  const groups = [...EGG_ORDER.map(g=>[g, EGGS[g].n]), ['evento','Eventos']];

function instantRune(s, id, lv){
  const t = today();
  if (id==='ev_renacer') { const fr = Object.entries(s.shadows).filter(([,v])=>v.ext && v.dorm).sort((a,b)=>b[1].rank-a[1].rank); if (!fr.length) return {ok:false, why:'No tienes sombras congeladas'};

  if (id==='ev_deseo') { const rw = runeWeek(s); const ag = (s.runeEq||[]).filter(x=>x!==id && runeLevel(s,x) && runeUsesLeft(s,x)===0); if (!ag.length) return {ok:false, why:'No tienes runas agotadas equipadas'};

  if (id==='ev_cosecha') { petInit(s); const n = lv>=3 ? 15 : 10; s.bayas += n; return {ok:true, msg:'+'+n+' Bayas Lunares'}; }
  if (id==='ev_animas') { s.afkBoost = Math.max(Date.now(), s.afkBoost||0) + (lv>=3?48:24)*3600e3; return {ok:true, msg:'Sombras farmeando ×3'}; }
  if (id==='ev_trueque') { s.shopHalf = (s.shopHalf||0) + (lv>=3?2:1); return {ok:true, msg:'Próxima compra a mitad de precio'}; }
  if (id==='ev_escarcha') { const w = s.weeks[wstart(t)]; if (!w || w.resolved) return {ok:false, why:'No hay jefe esta semana'}; w.hpCut = Math.min(0.3, (w.hpCut||0) + (lv>=3?0.08:0.05)); return {ok:true, msg:'El jefe pierde vida'}; }
  return {ok:false, why:'Efecto desconocido'};
}

// ---- Oferta del día ----
const DEAL_EXCH = [{id:'x_bayas', n:'10 Bayas Lunares', ic:'round-potion', p:60, give:{bayas:10}}, {id:'x_ess', n:'10 de Esencia', ic:'chemical-drop', p:90, give:{ess:10}}, {id:'x_cores', n:'3 Núcleos', ic:'crystal-shine', p:120, give:{cores:3}}];
const DEAL_POOL = ['esc_FUE','esc_AGI','esc_VIT','esc_INT','esc_PRE','freeze','dxp','ess5','cofre','elixir','incienso','retirada','recuerdo','doro','calor','brujula','destil','crisol','vendas'];
function dailyDeal(s){
  const d = today(); if (s.deal && s.deal.d === d) return s.deal;
  const x = Math.random()*100; let deal; const ev = eventFor(wstart(d)); s.dealOfr = s.dealOfr || {};
  const forceOfr = ev && !s.dealOfr[wstart(d)] && (Math.random() < 0.5 || dow(d)===7);
  if (forceOfr) { s.dealOfr[wstart(d)] = 1; deal = {kind:'ofrenda', ev}; }
  else if (x < 70) { const id = pick(DEAL_POOL); deal = {kind:'shop', id}; }
  else if (x < 74) deal = {kind:'shop', id:'cobre'};
  else if (x < 92) deal = {kind:'exch', id:pick(DEAL_EXCH).id};
  else if (x < 98) deal = {kind:'shop', id:'huevo'};
  else { const free = MERCH_COS.filter(([t,id])=>!(s.cos||[]).includes(t+':'+id)); deal = free.length ? {kind:'cos', cos:pick(free)} : {kind:'shop', id:'huevo'}; }
  s.deal = Object.assign({d, bought:false}, deal); s.dirty = 1; return s.deal;
}
function dealPrice(s, dl){ if (dl.kind==='ofrenda') return 150; if (dl.kind==='exch') return DEAL_EXCH.find(e=>e.id===dl.id).p; if (dl.kind==='cos') return 850; return Math.round(priceOf(s, SHOP.find(x=>x.id===dl.id))*0.85); }
function buyDeal(s){
  const dl = dailyDeal(s); if (dl.bought) return {ok:false, why:'Ya la compraste hoy'}; const p = dealPrice(s, dl);
  if (dl.kind==='exch') { if (s.gold < p) return {ok:false, why:'Te falta oro'}; const g = DEAL_EXCH.find(e=>e.id===dl.id).give; s.gold -= p; petInit(s);
    if (g.bayas) s.bayas += g.bayas; if (g.ess) s.ess += g.ess; if (g.cores) s.cores += g.cores; dl.bought = true; return {ok:true, msg:'Intercambio hecho'}; }
  if (dl.kind==='ofrenda') { if (s.gold < p) return {ok:false, why:'Te falta oro'}; petInit(s); s.gold -= p; s.ofr[dl.ev] = (s.ofr[dl.ev]||0)+1; dl.bought = true; return {ok:true, msg:'Ofrenda de '+EVENTS[dl.ev].n+' guardada en la Bolsa'}; }
  if (dl.kind==='cos') { if (s.gold < p) return {ok:false, why:'Te falta oro'}; s.gold -= p; s.cos = s.cos||[]; s.cos.push(dl.cos.join(':')); dl.bought = true; return {ok:true, cos:dl.cos}; }
  const r = buy(s, dl.id, p); if (r.ok) dl.bought = true; return r;
}

function lootCards(l){
  const cards = []; const card = (rc, icn, b, sm) => cards.push([rc, icn, b, sm]);
  if (l.gold) card('var(--gold)','two-coins', nf(l.gold)+' de oro');
  if (l.ess) card('var(--vio)','chemical-drop', nf(l.ess)+' de Esencia');
  if (l.cores) card('var(--sys)','crystal-shine', l.cores+(l.cores===1?' Núcleo':' Núcleos'));
  if (l.frags) card('var(--vio)','bottled-shadow', l.frags+(l.frags===1?' Fragmento':' Fragmentos')+' de Sombra');
  if (l.keys) card('var(--red)','skeleton-key','Llave Roja');
  for (const g of l.eggs||[]) card(EGGS[g.egg].c2, 'egg-clutch', esc(g.ev?'Huevo de '+EVENTS[g.ev].n:EGGS[g.egg].n), 'Al Santuario');
  if (l.bayas) card('#b58cff','round-potion', l.bayas+(l.bayas===1?' Baya Lunar':' Bayas Lunares'));
  if (l.esq) card('#ff6f91','crystal-shine', (l.esqN||1)+' '+((l.esqN||1)===1?'Esquirla':'Esquirlas')+' de '+esc(EVENTS[l.esq].n));
  if (l.cobre) card('#d9895b','rune-stone','Piedra de Cobre', 'A la Bolsa');
  for (const id of l.items||[]) { const it = ITEMS[id]; card('var(--c-'+it.r+')', itemIcon(it), esc(it.n), RAR_INFO[it.r].n+(it.boss?' · firma':'')); }
  for (const t of l.titles||[]) card('var(--gold)','laurel-crown','Título: '+esc(TITLES[t]));
  return `<div class="loot">${cards.map(([rc,icn,b,sm],i)=>`<div class="lcard" style="--rc:${rc}; animation-delay:${(0.3+i*0.18).toFixed(2)}s">${ic(icn)}<b>${b}</b>${sm?`<small>${sm}</small>`:''}</div>`).join('')}${runeLootCards(l)}</div>`;
}

// ---------- Partículas ----------
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#5cb8ff'; }
function particles({color='sys', n=80, smoke=false}){
  if (reduced) return; const cv = document.createElement('canvas'); cv.id = 'fxcanvas'; document.body.appendChild(cv);
  const dpr = Math.min(2, devicePixelRatio||1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; const g = cv.getContext('2d'); g.scale(dpr,dpr);
  const col = cssVar('--'+color); const cx = innerWidth/2, cy = innerHeight*0.4; const ps = [];
  // chispas
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = 1.2+Math.random()*(smoke?3:5.5);
    ps.push({k:'s', x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - (smoke?1.5:0), r:.8+Math.random()*2.4, life:1, dec:.007+Math.random()*.014}); }
  // humo de sombra
  if (smoke) for (let i=0;i<46;i++) ps.push({k:'m', x:cx+(Math.random()-.5)*260, y:cy+90+Math.random()*120, vx:(Math.random()-.5)*.5, vy:-(.5+Math.random()*1.4), r:30+Math.random()*50, life:1, dec:.004+Math.random()*.005, d:Math.random()*30});
  const t0 = performance.now(); let fr = 0;
  (function frame(t){ g.clearRect(0,0,innerWidth,innerHeight); let alive = 0; fr++;
    for (const p of ps){ if (p.life<=0) continue; if (p.d && p.d-- > 0) { alive++; continue; } alive++; p.x+=p.vx; p.y+=p.vy; p.life-=p.dec;
      if (p.k==='s') { p.vy += .035; p.vx *= .99; g.globalCompositeOperation='lighter'; g.globalAlpha = Math.max(0,p.life); g.fillStyle = col; g.beginPath(); g.arc(p.x,p.y,p.r,0,Math.PI*2); g.fill(); }
      else { p.r += .35; const gr = g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); gr.addColorStop(0, col); gr.addColorStop(1, 'transparent');
        g.globalCompositeOperation='lighter'; g.globalAlpha = Math.max(0, Math.min(1, p.life*1.4))*.16; g.fillStyle = gr; g.beginPath(); g.arc(p.x,p.y,p.r,0,Math.PI*2); g.fill(); } }
    g.globalCompositeOperation='source-over';
    if (alive && t-t0 < 5000) requestAnimationFrame(frame); else cv.remove(); })(t0);
}
function bgMotes(){
  const cv = $('#bgfx'); if (!cv || reduced) return; const g = cv.getContext('2d'); let W, H; const dpr = Math.min(2, devicePixelRatio||1);
  const fit = ()=>{ W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0); }; fit(); addEventListener('resize', fit);
  const ms = [...Array(42)].map(()=>({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:.5+Math.random()*1.8, v:.12+Math.random()*.45, a:Math.random()*Math.PI*2, vio:Math.random()<.3}));
  let col = cssVar('--sys'), vio = cssVar('--vio'); setInterval(()=>{ col = cssVar('--sys'); vio = cssVar('--vio'); }, 3000);
  (function f(){ g.clearRect(0,0,W,H); for (const m of ms){ m.y -= m.v; m.a += .01; m.x += Math.sin(m.a)*.25; if (m.y < -10) { m.y = H+10; m.x = Math.random()*W; }
    g.globalAlpha = .55; g.fillStyle = m.vio?vio:col; g.shadowColor = g.fillStyle; g.shadowBlur = 8; g.beginPath(); g.arc(m.x,m.y,m.r,0,Math.PI*2); g.fill(); }
    requestAnimationFrame(f); })();
}
function floatAt(el, html, cls){
  if (!el) return; const r = el.getBoundingClientRect(); const f = document.createElement('div'); f.className = 'float '+cls; f.innerHTML = html;
  f.style.left = (r.left + r.width*(cls==='xp'?0.82:0.5))+'px'; f.style.top = (r.top + r.height*0.3)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(), 1200);
}
