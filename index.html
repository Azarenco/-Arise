    case 'cobreuse': { const r = useCobre(S, v); if (!r.ok) return toast(r.why,'red'); save(); render(); if (r.r && r.r.up) { closeSheet(); toast('<b>Runa</b> '+esc(RUNE[v].n)+' sube a nivel '+['I','II','III'][r.r.lv-1]+'.', 'vio'); particles({color:'gold', n:90}); } else { openSheet(cobreSheet()); toast('<b>Runa</b> +1 piedra para '+esc(RUNE[v].n)+'.', 'vio'); } break; }
    case 'deal': { const r = buyDeal(S); if (!r.ok) return toast(r.why,'red'); pushLog(S, 'Oferta del día comprada.'); save(); render(); if (r.loot) { QUEUE.unshift({type:'room', loot:r.loot}); showNext(); } else toast('<b>Bazar</b> '+(r.cos?'Nuevo cosmético: '+esc(COS[r.cos[0]][r.cos[1]].n):r.msg?esc(r.msg):'¡Comprado!')+'.', 'vio'); break; }
    case 'petpat': { const p = el.querySelector('.pet'); if (p) { p.classList.remove('pat'); void p.offsetWidth; p.classList.add('pat'); } for (let i=0;i<3;i++) setTimeout(()=>floatAt(el, '♥', 'heart'), i*140); break; }
    case 'eqt': EQT = v; render(); scrollTo({top:0}); break;
    case 'libre': { if (v==='0') return toast('Esa comida libre se usó otro día de esta semana.','red'); const r = addLibre(S, VIEWDAY, Number(v)||1); if (!r.ok) return toast(r.why,'red'); const ev = tick(S); save(); render(); handleEvents(ev); break; }
    case 'sanf': SANF = v; render(); break;
    case 'codex': openSheet(codexSheet()); break;
    case 'pet': openSheet(petSheet(v)); break;
    case 'egg': openSheet(eggSheet(v)); break;
    case 'incinfo': { const inc = S.inc.find(x=>x.uid===v); const pr = incProgress(S,inc); toast(`<b>Incubadora</b> ${pr.cur}/${pr.need}: ${esc(EGGS[inc.egg].how)}.`, 'vio'); break; }
    case 'incubate': { const r = incubate(S, v); if (!r.ok) return toast(r.why,'red'); save(); closeSheet(); render(); toast('<b>Santuario</b> Huevo en la incubadora.', 'vio'); break; }
    case 'egrel': releaseEgg(S, v); save(); closeSheet(); render(); toast('<b>Santuario</b> Huevo liberado: +5 Bayas Lunares.', 'vio'); break;
    case 'hatch': { const r = hatch(S, v); if (!r.ok) return toast(r.why,'red'); save(); render(); cine(hatchCine(r), {color: r.pi.shiny?'gold':'vio', n: r.pi.shiny?220:140}); break; }
    case 'feed': case 'feedall': { const pi = S.pets.find(p=>p.uid===v); const r = feedPet(S, v, name==='feedall' ? 999 : 1); if (!r.ok) return toast(r.why,'red'); save(); render(); if ($('#sheet')) openSheet(petSheet(v));
      if (r.evolved) { closeSheet(); cine(`<div class="hatch">${petArt(pi,'xl')}</div><div class="big-num" style="font-size:30px">¡Evolución!</div><h2>${esc(PET[pi.id].n)} ya es ${PET_STAGE[pi.stage].toLowerCase()}</h2><p class="small">+${fmtV(petVal(S,pi))}${esc(PET[pi.id].txt)}</p>`, {color:'vio', n:160}); } break; }
    case 'petact': setActive(S, v); save(); render(); openSheet(petSheet(v)); break;
    case 'fuse': { const r = fusePet(S, v); if (!r.ok) return toast(r.why,'red'); save(); render(); openSheet(petSheet(v)); particles({color:'gold', n:90}); toast('<b>Santuario</b> ¡Fusión! Ahora tiene '+'⭐'.repeat(r.stars)+'.', 'vio'); break; }
    case 'shinyfuse': { const r = shinyFuse(S, v); if (!r.ok) return toast(r.why,'red'); save(); render(); openSheet(petSheet(v)); toast('<b>Santuario</b> Fusión brillante hecha.', 'vio'); break; }
    case 'petrel': { const r = releasePet(S, v); if (!r.ok) return toast(r.why,'red'); save(); closeSheet(); render(); toast('<b>Santuario</b> +'+r.n+' Bayas Lunares.', 'vio'); break; }
    case 'portal': openSheet(portalSheet()); break;
    case 'portalcalc': { const n = Number($('#pdays').value); $('#pcost').textContent = nf(15*n); break; }
    case 'portalgo': { const n = Number($('#pdays').value); const from = $('#pfrom').value; const r = buyPortal(S, n, from); if (!r.ok) return toast(r.why,'red'); pushLog(S, r.msg+'.'); save(); closeSheet(); render(); toast('<b>Tienda</b> '+esc(r.msg)+'.', 'vio'); break; }
    case 'stat': openSheet(statSheet(v)); break;
    case 'looks': openSheet(lookSheet()); break;
    case 'look': { const [t,id] = v.split(':'); if (!cosOwned(S,t,id)) break; S.look = Object.assign(lookOf(S), {[t]:id}); save(); openSheet(lookSheet()); render(); break; }
    case 'lookinfo': { const [t,id] = v.split(':'); const src = cosSource(t,id); toast(`<b>Bloqueado</b> ${src ? 'Se consigue con el logro «'+esc(src.n)+'»: '+esc(src.how.toLowerCase())+'.' : 'Solo lo vende el Mercader errante, alguna semana.'}`, 'vio'); break; }
    case 'tst': { if (!window.claude) break;
      if (v==='runes') { for (const id of ['sed','paso','fortaleza','banquete','ojo','dominio','paso','paso']) learnRune(S, id); toast('<b>Pruebas</b> Runas añadidas.', 'vio'); }
      if (v==='mission') { const w = S.weeks[wstart(today())]; if (w) { w.missions = (w.missions||[]).filter(m=>m.d!==today()); w.missions.push({d:today(), id:pick(MISSIONS).id, st:'new'}); ALERTED = {}; } closeSheet(); TAB = 'hoy'; HOYT = 'dia'; }
      if (v==='shadows') { for (const [h,r] of [['agua',1],['pasos',0],['lectura',2]]) S.shadows[h] = Object.assign(S.shadows[h]||{}, {ext:true, rank:r, dorm:false, extAt:today(), proc:addD(today(),-1)}); toast('<b>Pruebas</b> Sombras añadidas.', 'vio'); }
      if (v==='pets') { petInit(S); const mk = (P, stage, extra) => Object.assign({uid:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), id:P.id, stage, food:[0,20,80][stage], stars:0}, extra||{});
        const by = r => PETS.filter(p=>p.rar===r && !p.ev);
        const add = [mk(pick(by('c')),0), mk(pick(by('r')),1), mk(pick(by('e')),2,{shiny:true, stars:2}), mk(pick(PETS.filter(p=>p.ev)),1,{stars:1})];
        S.pets.push(...add); S.petAct = add.slice(0, petSlots(S)).map(p=>p.uid); toast('<b>Pruebas</b> 4 mascotas añadidas (cría, joven, adulta brillante y de evento).', 'vio'); }
      if (v==='eggs') { petInit(S); for (const g of [pick(EGG_ORDER), pick(EGG_ORDER), 'evento']) addEgg(S, g, g==='evento' ? pick(Object.keys(EVENTS)) : null);
        if ((S.inc||[]).length < 2) { addEgg(S, pick(EGG_ORDER)); const e = S.eggs.pop(); S.inc.push(Object.assign(e, {start:today(), bonus:99})); }
        toast('<b>Pruebas</b> 3 huevos en el Redil y 1 listo para eclosionar en la Incubadora.', 'vio'); }
      if (v==='bayas') { petInit(S); S.bayas += 50; toast('<b>Pruebas</b> +50 Bayas Lunares.', 'vio'); }
      save(); if (v!=='mission') openSheet(profileSheet()); render(); break; }
    case 'expdest': EXPSEL = {dest:v, lv:0, team:[]}; openSheet(expSheet()); break;
    case 'explv': EXPSEL.lv = +v; openSheet(expSheet()); break;
    case 'expteam': { const i = EXPSEL.team.indexOf(v); if (i>=0) EXPSEL.team.splice(i,1); else if (EXPSEL.team.length < 3) EXPSEL.team.push(v); else toast('Máximo 3 sombras por expedición', 'red'); openSheet(expSheet()); break; }
    case 'expsend': { const r = sendExp(S, EXPSEL.dest, EXPSEL.lv, EXPSEL.team); if (!r.ok) return toast(r.why,'red'); pushLog(S, 'Expedición enviada: '+DEST[EXPSEL.dest].n+'.'); save(); closeSheet(); SHT = 'exp'; render(); toast('<b>Expedición</b> Tus sombras han partido.', 'vio'); particles({color:'vio', n:80, smoke:true}); break; }
    case 'expcol': { const r = collectExp(S, v); if (!r || r.err) return toast(r ? r.err : 'No encontrada', 'red'); save(); render(); QUEUE.unshift({type:'exp', r}); showNext(); break; }
    case 'armory': openSheet(armorySheet()); break;
    case 'armitem': openSheet(armItemSheet(v)); break;
    case 'pt': { const used = Object.values(PEND).reduce((a,b)=>a+b,0); if (used < freePoints(S)) { PEND[v] = (PEND[v]||0)+1; render(); } break; }
    case 'ptno': PEND = {}; render(); break;
    case 'ptok': if (spendPoints(S, PEND)) { const n = Object.values(PEND).reduce((a,b)=>a+b,0); pushLog(S, 'Asignados '+n+' puntos de estadística.'); PEND = {}; save(); render(); particles({color:'gold', n:40}); toast('<b>Sistema</b> Puntos asignados.'); } break;
    case 'bossinfo': openSheet(bossInfoSheet(v, !!el.closest('.sheet'))); break;
    case 'close': closeSheet(); break;
    case 'redopen': if (openRed(S)) { GATET = 'roja'; save(); render(); toast('<b>Puerta Roja</b> La Puerta Roja se ha abierto.','red'); particles({color:'red', n:120}); } break;
    case 'redend': { const r = finishRed(S); if (r) { save(); render(); QUEUE.unshift(Object.assign({type:'red'}, r)); showNext(); } break; }
    case 'profile': openSheet(profileSheet()); break;
    case 'export': { const code = 'ARISE1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(()=>toast('<b>Sistema</b> Código copiado.'), ()=>{ $('#imp').value = code; toast('<b>Sistema</b> Copia el código del campo de abajo.'); }); break; }
    case 'import': { try { const raw = $('#imp').value.trim().replace(/^ARISE1:/,''); const obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); if (!obj || !obj.days) throw 0; S = obj; save(); closeSheet(); applyTheme(); render(); toast('<b>Sistema</b> Progreso restaurado.'); } catch(e){ toast('Código no válido. Comprueba que esté completo.','red'); } break; }
    case 'reset': openSheet(`<h3>¿Reiniciar el progreso?</h3><p class="small muted">Se borra todo: nivel, oro, equipo, sombras y jefes derrotados. Si quieres conservar una copia, usa antes «Copiar código» en el perfil.</p><div class="row" style="flex-wrap:wrap; margin-top:12px"><button class="btn primary red" data-act="resetok">Sí, borrar todo</button><button class="btn" data-act="profile">Cancelar</button></div>`); break;
    case 'resetok': { S = null; PEND = {}; QUEUE = []; TAB = 'hoy'; try{ localStorage.removeItem(LS); }catch(e){} if (DOC) DOC.set({s:'null', at:Date.now()}).catch(()=>{}); closeSheet(); render(); scrollTo({top:0}); break; }
    case 'gateok': { const g = $('#gateov'); if (g) { g.classList.add('out'); setTimeout(()=>g.remove(), 450); } SHOWING = false; save(); setTimeout(()=>{ render(); showNext(); }, 460); break; }
    case 'cineok': { const c = $('#cine'); if (c) c.remove(); SHOWING = false; save(); render(); showNext(); break; }
  }
}
function minionDeaths(m0, d){
  const m1 = minionsOf(S,d);
  for (const m of m1) { const o = m0.find(x=>x.b===m.b); if (m.dead && o && !o.dead) {
    const el = document.querySelector(`.block[data-b="${m.b}"] .mhead`); if (el) { el.classList.add('kill'); floatAt(el, '¡'+esc(m.n)+' derrotado!', 'kill'); }
    toast(`<b>Sala</b> Has derrotado a ${esc(m.n)}.`); } }
  if (m1.every(m=>m.dead) && !m0.every(m=>m.dead)) particles({color:'gold', n:60});
}
function gateReplay(){
  const ws = wstart(today()); const b = battle(S, ws); if (!b || !b.bosses.length) return;
  S.gateSeen = S.gateSeen || {}; const seen = S.gateSeen[ws]; S.gateSeen = {[ws]: b.dealt}; save();
  if (seen === undefined || b.dealt <= seen) return;
  const bars = document.querySelectorAll('.hpbig i'); const prev = Math.max(0, 1 - seen/b.total)*100, cur = Math.max(0, 1 - b.dealt/b.total)*100;
  bars.forEach(i=>{ i.style.transition = 'none'; i.style.width = prev+'%'; }); void document.body.offsetWidth;
  setTimeout(()=>{ bars.forEach(i=>{ i.style.transition = ''; i.style.width = cur+'%'; }); hitBoss(3); floatAt($('#bigboss'), `<small>Desde tu última visita</small>−${nf(b.dealt-seen)}`, 'crit'); particles({color:'red', n:70}); }, 450);
}
function shake(){ const b = $('#bstrip'); if (b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } }
function doToggle(hid){
  const d = VIEWDAY; const ws = wstart(d); const b0 = battle(S,ws); const was = done(S,d,hid); const m0 = minionsOf(S,d);
  const r = toggle(S, d, hid); if (r.err) return toast(r.err, 'red');
  const b1 = battle(S,ws); const ev = tick(S); save(); render();
  const row = document.querySelector(`.hrow[data-h="${hid}"]`);
  if (!was && row) { row.classList.add('flash'); petJump(); if (r.gained) floatAt(row, '+'+r.gained+' XP', 'xp');
    const dmg = b1 && b0 ? b1.dealt - b0.dealt : 0;
    if (dmg>0) { const crit = !!HB[hid].w; floatAt($('#bstrip'), crit ? `<small>Crítico</small>−${nf(dmg)}` : '−'+nf(dmg), crit?'crit':'dmg'); shake(); hitBoss(crit?2:1); }}
  minionDeaths(m0, d);
  handleEvents(ev);
}

// ---------- Arranque ----------
document.addEventListener('click', e=>{ const el = e.target.closest('[data-act]'); if (!el) return; if (el.disabled) return; e.preventDefault(); act(el.dataset.act, el.dataset.v || el.dataset.h, el); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#sheet')) { closeSheet(); return; } if ((e.key==='Enter'||e.key===' ') && e.target.matches('.hrow')) { e.preventDefault(); act('tg', e.target.dataset.h, e.target); } });
document.addEventListener('change', e=>{ const k = e.target.dataset.chg; if (!k || !S) return;
  if (k==='sanf') { SANF = e.target.value; render(); return; }
  if (k==='portalcalc') { const c = $('#pcost'); if (c) c.textContent = nf(15*Number(e.target.value)); return; }
  if (k==='title') S.title = e.target.value; if (k==='theme') { S.theme = e.target.value; applyTheme(); } if (k==='name') S.name = e.target.value.trim() || S.name;
  save(); render(); });
// Lo que se sortea al pintar (Oferta del día, Mercader) se guarda al momento
const _renderBase = render; render = function(){ _renderBase(); tintWins(); if (S && S.dirty) { delete S.dirty; save(); } };
// 'azul' = se queda con el azul del Sistema
const SEC_C = {'Runas':'#4fd2c8', 'Mascotas':'#a98bff', 'Diarios de la semana':'#4fd2c8', 'Salas de la semana':'azul', 'Botín':'#f4c652', 'Golpes de la semana':'azul', 'Incubadora':'azul', 'Redil':'#4fd2c8', 'Inventario':'#ffb35c', 'Estadísticas':'azul', 'Cómo funcionan':'#a98bff', 'Habilidades':'#4fd2c8', 'Recursos':'#f4c652', 'Objetos':'azul', 'Catálogo del Sistema':'azul', 'Bonus de set':'#ff8a3d', 'Destinos':'#a98bff', 'Equipo activo':'azul', 'Evolución semanal':'azul'};
const SEC_PAL = ['#5cb8ff','#3ddc97','#ffb35c','#ff7a9a','#a98bff','#4fd2c8','#f4c652','#ff8a3d'];
function tintWins(){
  document.querySelectorAll('.win > .wh').forEach(wh=>{ const w = wh.parentElement; let c = wh.style.color;
    if (!c) { if (['gold','red','vio','block','deal','merch','chron'].some(k=>w.classList.contains(k))) return; const t = (wh.querySelector('h2')||{}).textContent||''; if (!t) return;
      c = SEC_C[t] || SEC_PAL[[...t].reduce((a,ch)=>a+ch.charCodeAt(0),0) % SEC_PAL.length]; if (c==='azul') return; wh.style.color = c; }
    w.style.setProperty('--sys', c); });
}
function boot(){
  setInterval(tickTimers, 1000);
  S = lsGet(); if (S) afterLoad();
  runTick(); render(); bgMotes(); connectDb();
  let last = today(); setInterval(()=>{ if (!S) return; if (today()!==last) { last = today(); VIEWDAY = today(); runTick(); save(); render(); } else if (TAB==='sombras' && !$('#sheet') && !$('#cine')) render(); }, 60000);
}
boot();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
